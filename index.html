<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@300;500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0: #0A0A0B;
    --bg-1: #161314;
    --ink: #F2ECE4;
    --ink-dim: #9C938E;
    --ink-faint: #5C5451;
    --track: rgba(242,236,228,0.08);
    --focus: #C22A2E;
    --focus-soft: rgba(194,42,46,0.22);
    --rest: #7C3336;
    --rest-soft: rgba(124,51,54,0.22);
    --accent: var(--focus);
    --accent-soft: var(--focus-soft);
    --ring-size: min(62vw, 420px);
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
  }

  body{
    margin: 0;
    background:
      radial-gradient(circle at 50% 15%, rgba(194,42,46,0.08), transparent 55%),
      var(--bg-0);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    transition: background-color 0.6s ease;
  }

  .app{
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .eyebrow{
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    color: var(--ink-faint);
    margin-bottom: 6px;
  }

  .title{
    font-family: 'Zilla Slab', serif;
    font-weight: 500;
    font-size: clamp(1.6rem, 5vw, 2.1rem);
    color: var(--ink);
    margin: 0 0 30px 0;
    text-align: center;
  }

  /* --- mode switch --- */
  .switch{
    display: flex;
    gap: 4px;
    background: var(--bg-1);
    border: 1px solid rgba(243,238,227,0.08);
    border-radius: 999px;
    padding: 5px;
    margin-bottom: 40px;
  }

  .switch button{
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-dim);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .switch button.active{
    color: var(--ink);
    font-weight: 600;
  }

  .switch button[data-mode="focus"].active{ background: var(--focus); }
  .switch button[data-mode="rest"].active{ background: var(--rest); }

  /* --- ring --- */
  .ring-wrap{
    position: relative;
    width: var(--ring-size);
    height: var(--ring-size);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 36px;
  }

  .ring-wrap svg{
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring-track{
    fill: none;
    stroke: var(--track);
    stroke-width: 3.5;
  }

  .ring-progress{
    fill: none;
    stroke: var(--accent);
    stroke-width: 3.5;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke 0.4s ease;
  }

  .ring-wrap.running .ring-progress{
    filter: drop-shadow(0 0 10px var(--accent-soft));
  }

  @media (prefers-reduced-motion: no-preference){
    .ring-wrap.running{
      animation: breathe 3.6s ease-in-out infinite;
    }
  }

  @keyframes breathe{
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.012); }
  }

  .ring-center{
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .time{
    font-family: 'Zilla Slab', serif;
    font-weight: 300;
    font-size: clamp(3.4rem, 15vw, 5.6rem);
    line-height: 1;
    font-variant-numeric: lining-nums tabular-nums;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  .state-label{
    margin-top: 10px;
    font-size: 0.92rem;
    color: var(--ink-dim);
    letter-spacing: 0.01em;
  }

  /* --- controls --- */
  .controls{
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 34px;
  }

  .btn{
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: 'Work Sans', sans-serif;
    transition: transform 0.15s ease, background-color 0.3s ease, opacity 0.2s ease;
  }

  .btn:active{ transform: scale(0.96); }

  .btn-primary{
    background: var(--accent);
    color: var(--ink);
    font-weight: 600;
    font-size: 1.02rem;
    padding: 16px 44px;
    border-radius: 999px;
  }

  .btn-secondary{
    background: transparent;
    color: var(--ink-dim);
    font-size: 0.88rem;
    font-weight: 500;
    padding: 10px 6px;
    border-bottom: 1px solid transparent;
  }

  .btn-secondary:hover{
    color: var(--ink);
    border-bottom-color: var(--ink-faint);
  }

  .btn:focus-visible{
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  /* --- cycles --- */
  .cycles{
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--track);
    transition: background-color 0.3s ease;
  }

  .dot.done{
    background: var(--focus);
  }

  .cycles-label{
    font-size: 0.76rem;
    color: var(--ink-faint);
    margin-top: 12px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="app">
  <div class="eyebrow">temporizador</div>
  <h1 class="title">Enfoque, luego descanso</h1>

  <div class="switch" role="tablist" aria-label="Modo">
    <button data-mode="focus" class="active" role="tab" aria-selected="true">Enfoque · 25 min</button>
    <button data-mode="rest" role="tab" aria-selected="false">Descanso · 5 min</button>
  </div>

  <div class="ring-wrap" id="ringWrap">
    <svg viewBox="0 0 200 200">
      <circle class="ring-track" cx="100" cy="100" r="92"></circle>
      <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="92"></circle>
    </svg>
    <div class="ring-center">
      <div class="time" id="timeDisplay">25:00</div>
      <div class="state-label" id="stateLabel">Listo para enfocarte</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-secondary" id="resetBtn">Reiniciar</button>
    <button class="btn btn-primary" id="startBtn">Iniciar</button>
  </div>

  <div class="cycles" id="cycles">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
  <div class="cycles-label">pomodoros completados hoy</div>
</div>

<script>
  const DURATIONS = { focus: 25 * 60, rest: 5 * 60 };
  const LABELS_READY = { focus: 'Listo para enfocarte', rest: 'Listo para descansar' };
  const LABELS_RUNNING = { focus: 'Enfocado', rest: 'Descansando' };
  const LABELS_PAUSED = { focus: 'En pausa', rest: 'En pausa' };

  let mode = 'focus';
  let remaining = DURATIONS.focus;
  let timerId = null;
  let running = false;
  let completedCycles = 0;

  const timeDisplay = document.getElementById('timeDisplay');
  const stateLabel = document.getElementById('stateLabel');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const ringWrap = document.getElementById('ringWrap');
  const ringProgress = document.getElementById('ringProgress');
  const switchButtons = document.querySelectorAll('.switch button');
  const dots = document.querySelectorAll('.dot');

  const RADIUS = 92;
  const CIRCUMFERENCE = 2 * Math.PI * RADIUS;
  ringProgress.style.strokeDasharray = CIRCUMFERENCE;

  function formatTime(sec){
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return m + ':' + s;
  }

  function updateDisplay(){
    timeDisplay.textContent = formatTime(remaining);
    const total = DURATIONS[mode];
    const fraction = remaining / total;
    ringProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - fraction);
  }

  function setMode(newMode, resetTime = true){
    mode = newMode;
    document.documentElement.style.setProperty('--accent', mode === 'focus' ? 'var(--focus)' : 'var(--rest)');
    document.documentElement.style.setProperty('--accent-soft', mode === 'focus' ? 'var(--focus-soft)' : 'var(--rest-soft)');
    switchButtons.forEach(btn => {
      const isActive = btn.dataset.mode === mode;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-selected', isActive);
    });
    if (resetTime){
      remaining = DURATIONS[mode];
    }
    updateDisplay();
    updateStateLabel();
  }

  function updateStateLabel(){
    if (running){
      stateLabel.textContent = LABELS_RUNNING[mode];
    } else if (remaining < DURATIONS[mode]){
      stateLabel.textContent = LABELS_PAUSED[mode];
    } else {
      stateLabel.textContent = LABELS_READY[mode];
    }
  }

  function tick(){
    remaining -= 1;
    if (remaining <= 0){
      remaining = 0;
      updateDisplay();
      finishSession();
      return;
    }
    updateDisplay();
  }

  function start(){
    if (running) return;
    running = true;
    ringWrap.classList.add('running');
    startBtn.textContent = 'Pausar';
    updateStateLabel();
    timerId = setInterval(tick, 1000);
  }

  function pause(){
    running = false;
    ringWrap.classList.remove('running');
    startBtn.textContent = 'Continuar';
    clearInterval(timerId);
    updateStateLabel();
  }

  function reset(){
    clearInterval(timerId);
    running = false;
    ringWrap.classList.remove('running');
    startBtn.textContent = 'Iniciar';
    remaining = DURATIONS[mode];
    updateDisplay();
    updateStateLabel();
  }

  function finishSession(){
    clearInterval(timerId);
    running = false;
    ringWrap.classList.remove('running');
    playAlarm();

    if (mode === 'focus'){
      completedCycles = Math.min(completedCycles + 1, dots.length);
      updateDots();
      setMode('rest');
    } else {
      setMode('focus');
    }
    startBtn.textContent = 'Iniciar';
    updateStateLabel();
  }

  function updateDots(){
    dots.forEach((dot, i) => {
      dot.classList.toggle('done', i < completedCycles);
    });
  }

  // --- Alarma: suena exactamente 2 segundos al terminar ---
  function playAlarm(){
    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();
      const duration = 2; // segundos exactos
      const now = ctx.currentTime;

      const beepPattern = [0, 0.4, 0.8, 1.2]; // inicios de cada beep dentro de los 2s
      beepPattern.forEach(offset => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        osc.connect(gain);
        gain.connect(ctx.destination);

        const start = now + offset;
        const end = start + 0.32;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.35, start + 0.02);
        gain.gain.linearRampToValueAtTime(0, end);

        osc.start(start);
        osc.stop(end);
      });

      setTimeout(() => ctx.close(), (duration + 0.5) * 1000);
    } catch(e){
      console.warn('No se pudo reproducir la alarma', e);
    }
  }

  startBtn.addEventListener('click', () => {
    if (running) pause(); else start();
  });

  resetBtn.addEventListener('click', reset);

  switchButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.mode === mode) return;
      clearInterval(timerId);
      running = false;
      ringWrap.classList.remove('running');
      startBtn.textContent = 'Iniciar';
      setMode(btn.dataset.mode);
    });
  });

  setMode('focus');
</script>

</body>
</html>
